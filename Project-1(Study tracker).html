<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Study Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <h1>Student Study Tracker</h1>
            <p> Track your Daily Study Progress and save your notes</p>
        </header>
    <main>
        <section class="study-tracker">
            <h2>Study Tracker</h2>
            <form id="study-form">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>

                <label for="hours">Hours Studied:</label>
                <input type="number" id="hours" name="hours" min="0" step="0.1" required>

                <label for="notes">Notes:</label>
                <textarea id="notes" name="notes"></textarea>

                <button type="submit">Add Study Session</button>
            </form>

            <h3>Study Sessions</h3>
            <ul id="study-sessions"></ul>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Student Study Tracker. All rights reserved.</p>  
    </footer>
    <script src="script.js"></script>
    </body>
</html>
